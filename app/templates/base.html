<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}MTG Collection Manager{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css?v={{ asset_version() }}">
</head>
<body>
  <header class="nav">
    <span class="brand">MTG Collection Manager</span>
    <nav>
      {% set path = request.url.path %}
      <a href="/" class="{{ 'active' if path == '/' }}">Dashboard</a>
      <a href="/collection" class="{{ 'active' if path.startswith('/collection') }}">Collection</a>
      <a href="/wishlist" class="{{ 'active' if path.startswith('/wishlist') }}">Wishlist</a>
      <a href="/deck" class="{{ 'active' if path.startswith('/deck') }}">Decks</a>
      <a href="/games" class="{{ 'active' if path.startswith('/games') }}">Games</a>
      <a href="/table" class="{{ 'active' if path.startswith('/table') }}">Table</a>
      <a href="/docs">API</a>
    </nav>
  </header>
  <main>
    {% if msg %}<div class="flash {{ 'error' if error }}">{{ msg }}</div>{% endif %}
    {% block content %}{% endblock %}
  </main>
  <script>
    // Forms marked data-keep-scroll reload the same page; put the reader back where they were.
    const scrollKey = "scroll:" + location.pathname;
    try {
      const saved = sessionStorage.getItem(scrollKey);
      if (saved !== null) {
        sessionStorage.removeItem(scrollKey);
        history.scrollRestoration = "manual";
        window.scrollTo(0, Number(saved));
      }
    } catch (error) { /* storage unavailable: the page just starts at the top */ }
    document.addEventListener("submit", (event) => {
      if (!event.target.hasAttribute("data-keep-scroll")) return;
      try { sessionStorage.setItem(scrollKey, String(window.scrollY)); } catch (error) {}
    });

    // Two-click confirmation for destructive buttons: the first click arms the button, the second submits.
    // (Not window.confirm(): embedded browsers suppress native dialogs, which silently cancels the action.)
    document.addEventListener("submit", (event) => {
      const form = event.target;
      if (!form.dataset.confirm || form.dataset.armed) return;
      event.preventDefault();
      const button = form.querySelector("button");
      const label = button.textContent;
      form.dataset.armed = "1";
      button.textContent = form.dataset.confirm;
      button.classList.add("danger");
      setTimeout(() => {
        delete form.dataset.armed;
        button.textContent = label;
        button.classList.remove("danger");
      }, 4000);
    });
  </script>
  <script>
    // Every panel with a title can be folded away by clicking the title. What you fold is remembered
    // per kind of page: fold "Basic lands" on one deck and it is folded on every deck.
    (() => {
      const page = location.pathname.replace(/\/\d+(?=\/|$)/g, "/*");
      // "In this deck (8)" and "Tokens · 12 to bring" are the same panel whatever the numbers.
      const titleOf = (heading) => heading.textContent.split(/[·(]/)[0].replace(/\d+/g, "").trim();
      const folded = (() => { try { return new Set(JSON.parse(localStorage.getItem("folded-panels") || "[]")); } catch (error) { return new Set(); } })();
      const save = () => { try { localStorage.setItem("folded-panels", JSON.stringify([...folded])); } catch (error) {} };

      for (const panel of document.querySelectorAll("main .panel")) {
        const heading = panel.querySelector(":scope > h2, :scope > .toolbar > h2");
        if (!heading || !titleOf(heading)) continue;
        const head = heading.parentElement === panel ? heading : heading.parentElement;
        head.classList.add("panel-head");
        heading.classList.add("fold-title");
        heading.tabIndex = 0;
        heading.setAttribute("role", "button");
        const key = `${page}|${titleOf(heading)}`;
        const apply = (fold) => {
          panel.classList.toggle("folded", fold);
          heading.setAttribute("aria-expanded", String(!fold));
          heading.title = fold ? "Click to show this part again" : "Click to fold this part away";
        };
        apply(folded.has(key));
        const toggle = (event) => {
          if (event.target.closest("a, button:not(.fold-title), input, select, label")) return;
          const fold = !panel.classList.contains("folded");
          fold ? folded.add(key) : folded.delete(key);
          save();
          apply(fold);
        };
        heading.addEventListener("click", toggle);
        heading.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") { event.preventDefault(); toggle(event); }
        });
      }
    })();
  </script>
  <script>
    // The colour filter of _colour_filter.html: pressed buttons and a match mode, remembered under
    // `storageKey`. matches(text) takes colour letters in WUBRG order ("" colourless, "?" unknown).
    function colourFilter(prefix, storageKey, defaultMode, onChange) {
      const buttons = [...document.querySelectorAll(`#${prefix}-colors button`)];
      const mode = document.getElementById(`${prefix}-color-mode`);
      const reset = document.getElementById(`${prefix}-colors-reset`);
      const chosen = () => buttons.filter((b) => b.getAttribute("aria-pressed") === "true").map((b) => b.dataset.color);
      try {
        const saved = JSON.parse(localStorage.getItem(storageKey) || "{}");
        for (const button of buttons) button.setAttribute("aria-pressed", String((saved.colors || []).includes(button.dataset.color)));
        if (saved.mode) mode.value = saved.mode;
      } catch (error) {}
      if (!mode.value) mode.value = defaultMode;

      function changed() {
        reset.hidden = chosen().length === 0;
        try { localStorage.setItem(storageKey, JSON.stringify({ colors: chosen(), mode: mode.value })); } catch (error) {}
        onChange();
      }
      for (const button of buttons) {
        button.addEventListener("click", () => {
          button.setAttribute("aria-pressed", String(button.getAttribute("aria-pressed") !== "true"));
          changed();
        });
      }
      mode.addEventListener("change", changed);
      reset.addEventListener("click", () => {
        for (const button of buttons) button.setAttribute("aria-pressed", "false");
        changed();
      });
      reset.hidden = chosen().length === 0;

      return {
        active: () => chosen().length > 0,
        matches(text) {
          const picked = chosen();
          if (picked.length === 0) return true;
          if (text === "?") return false;  // colours not fetched yet
          const colors = new Set(text);
          const want = picked.filter((c) => c !== "C");
          if (mode.value === "within") return [...colors].every((c) => want.includes(c));
          if (mode.value === "exact") return colors.size === want.length && want.every((c) => colors.has(c));
          return want.some((c) => colors.has(c)) || (colors.size === 0 && picked.includes("C"));
        },
      };
    }
  </script>
  <script>
    // Tabs: a .tabbed element with buttons [data-tab] in its .tabs, and parts [data-tab-panel]. The tab
    // you chose is remembered per kind of page (data-tabs); a link like #improve opens that tab.
    for (const box of document.querySelectorAll(".tabbed")) {
      const buttons = [...box.querySelectorAll(":scope > .tabs [data-tab], :scope > .panel-head .tabs [data-tab]")];
      const parts = [...box.querySelectorAll(":scope > [data-tab-panel]")];
      const names = buttons.map((button) => button.dataset.tab).filter((name) => parts.some((part) => part.dataset.tabPanel === name));
      buttons.forEach((button) => { button.hidden = !names.includes(button.dataset.tab); });
      const bar = box.querySelector(":scope > .tabs");
      if (bar) bar.hidden = names.length < 2;  // one tab is no choice
      const key = "tab:" + box.dataset.tabs;
      const open = (name, remember) => {
        buttons.forEach((button) => button.setAttribute("aria-selected", String(button.dataset.tab === name)));
        parts.forEach((part) => part.classList.toggle("tab-hidden", part.dataset.tabPanel !== name));
        if (remember) { try { localStorage.setItem(key, name); } catch (error) {} }
        window.dispatchEvent(new Event("resize"));  // charts in a tab that was hidden take their size
      };
      let start = location.hash.slice(1);
      if (!names.includes(start) && box.dataset.open) start = box.dataset.open;  // the page asks for a tab
      if (!names.includes(start)) { try { start = localStorage.getItem(key); } catch (error) { start = null; } }
      open(names.includes(start) ? start : names[0], false);
      buttons.forEach((button) => button.addEventListener("click", () => open(button.dataset.tab, true)));
      box.openTab = (name) => open(name, true);
    }
  </script>
  <script>
    // Typing ahead: an input with data-autocomplete="card|token|commander" suggests card names from
    // Scryfall, with a picture of the highlighted one. Arrow keys and Enter pick; Escape closes.
    (() => {
      const imageOf = (name) => `https://api.scryfall.com/cards/named?format=image&version=small&exact=${encodeURIComponent(name)}`;
      function attach(input) {
        if (input.dataset.acReady) return;
        input.dataset.acReady = "1";
        input.autocomplete = "off";
        const box = document.createElement("div");
        box.className = "ac-box";
        box.hidden = true;
        box.innerHTML = '<ul role="listbox"></ul><img alt="" hidden>';
        input.insertAdjacentElement("afterend", box);
        input.parentElement.classList.add("ac-anchor");
        const list = box.querySelector("ul");
        const picture = box.querySelector("img");
        let names = [];
        let active = -1;
        let timer = null;
        let asked = "";
        const close = () => { box.hidden = true; active = -1; };
        const highlight = (index) => {
          active = index;
          [...list.children].forEach((item, i) => item.classList.toggle("active", i === index));
          picture.hidden = index < 0 || input.dataset.autocomplete === "token";
          if (index >= 0) picture.src = imageOf(names[index]);
        };
        const pick = (index) => {
          input.value = names[index];
          close();
          input.dispatchEvent(new Event("change", { bubbles: true }));
        };
        async function lookUp() {
          const query = input.value.trim();
          if (query.length < 2) { close(); return; }
          asked = query;
          try {
            const response = await fetch(`/api/autocomplete?kind=${input.dataset.autocomplete}&q=${encodeURIComponent(query)}`);
            const data = await response.json();
            if (asked !== query || input.value.trim() !== query) return;  // typed on meanwhile
            names = data.names || [];
          } catch (error) { names = []; }
          list.innerHTML = "";
          for (const [index, name] of names.entries()) {
            const item = document.createElement("li");
            item.textContent = name;
            item.setAttribute("role", "option");
            item.addEventListener("mousedown", (event) => { event.preventDefault(); pick(index); });
            item.addEventListener("mouseenter", () => highlight(index));
            list.append(item);
          }
          box.hidden = names.length === 0 || document.activeElement !== input;
          highlight(names.length ? 0 : -1);
        }
        input.addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(lookUp, 200); });
        input.addEventListener("keydown", (event) => {
          if (box.hidden) return;
          if (event.key === "ArrowDown") { event.preventDefault(); highlight(Math.min(names.length - 1, active + 1)); }
          else if (event.key === "ArrowUp") { event.preventDefault(); highlight(Math.max(0, active - 1)); }
          else if (event.key === "Enter" && active >= 0) { event.preventDefault(); pick(active); }
          else if (event.key === "Escape") { close(); }
        });
        input.addEventListener("blur", () => setTimeout(close, 100));
      }
      window.attachAutocomplete = attach;
      document.querySelectorAll("input[data-autocomplete]").forEach(attach);
    })();
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
